name: Compress Member Profiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compress-member-profiles.yml'
permissions:
  contents: write
jobs:
  update-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/compress-member-profiles.mjs
      - name: Preserve reviewed TAEHOON public trait
        run: node -e "const fs=require('fs');const p='src/pages/member-taehoon.json';let s=fs.readFileSync(p,'utf8');s=s.replace('사람을 좋아하고 자신이 원하는 것에도 솔직하다.','사람을 좋아하고 친구가 많은 편이며, 자신이 원하는 것에도 솔직하다.');fs.writeFileSync(p,s);"
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit member profile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/member-doha.json src/pages/member-woohyun.json src/pages/member-jiwoo.json src/pages/member-ihwan.json src/pages/member-taehoon.json
          git commit -m "Compress member profile copy" || exit 0
          git push
