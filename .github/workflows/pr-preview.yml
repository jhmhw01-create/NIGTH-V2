name: Build PR Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Refresh media manifests
        run: npm run audit:media:update
      - name: Verify media manifests
        run: npm run audit:media
      - name: Build preview
        run: UPDATE_LEGACY_ASSET_AUDIT=1 npm run build
      - name: Verify JIWOO acting page
        run: |
          test -s dist/jiwoo-acting.html
          test -s dist/member-jiwoo.html
          test -s dist/assets/css/style.css
      - name: Upload preview site
        uses: actions/upload-artifact@v4
        with:
          name: jiwoo-acting-preview
          path: dist
          retention-days: 7
