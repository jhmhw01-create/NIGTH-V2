name: Polish Member Profiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-member-profiles.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/polish-member-profiles.mjs
      - run: node scripts/polish-member-profiles-v2.mjs
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit polished profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/member-*.json maintenance tests/member-page-normalization.test.mjs
          git commit -m "Polish member profile copy" || exit 0
          git push
