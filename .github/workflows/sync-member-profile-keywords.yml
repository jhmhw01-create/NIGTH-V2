name: Sync Member Profile Keywords
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-member-profile-keywords.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/sync-member-profile-keywords.mjs
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit member keyword sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/member-*.json src/data/archive.json maintenance
          git commit -m "Sync member profile keywords" || exit 0
          git push
