name: Apply Missing Notices V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-missing-notices-v2.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Reconcile notice data and page
        run: |
          node <<'NODE'
          const fs=require('fs');
          let notices=JSON.parse(fs.readFileSync('src/data/notices.json','utf8'));
          const ids=new Set(['nightmare-release','out-of-frame-2029','luna5-release','luna6-release','second-concert-2026','season-greetings-2027','season-greetings-2028','season-greetings-2029']);
          notices=notices.filter(n=>!ids.has(n.id));
          notices.push(
            {id:'season-greetings-2029',title:'2029 SEASON’S GREETINGS SUNDAY CLUB 공개',attributesHtml:' data-notice-category="fanclub" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2029.01.02</time><span class="notice-category">SEASON’S GREETINGS</span><strong>{{title}}</strong></summary><div class="notice-body"><p>NIGHT의 2029 시즌그리팅 <strong>SUNDAY CLUB</strong> 공식 아카이브가 공개되었습니다. 13장의 콘셉트 비주얼과 9장의 패키지 이미지를 확인하세요.</p><a class="notice-feature-image" href="season-greetings-2029.html"><img src="assets/images/2029/season-greetings/sunday-club-01-main.webp" alt="2029 SUNDAY CLUB 시즌그리팅" loading="lazy"></a><a class="notice-link-btn" href="season-greetings-2029.html">EXPLORE SUNDAY CLUB →</a></div>'},
            {id:'nightmare-release',title:'NIGHTMARE 발매 및 BLACK NIGHT 공개',attributesHtml:' data-notice-category="music" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2029.02.23</time><span class="notice-category">RELEASE</span><strong>{{title}}</strong></summary><div class="notice-body"><p>NIGHT의 앨범 <strong>NIGHTMARE</strong>와 타이틀곡 <strong>BLACK NIGHT</strong>가 공개되었습니다.</p><a class="notice-feature-image" href="nightmare-2029.html"><img src="assets/images/2029/nightmare/nightmare-release.webp" alt="NIGHTMARE BLACK NIGHT 발매 이미지" loading="lazy"></a><a class="notice-link-btn" href="nightmare-2029.html">VIEW ALBUM ARCHIVE →</a></div>'},
            {id:'out-of-frame-2029',title:'OUT OF FRAME 공식 전시 아카이브 공개',attributesHtml:' data-notice-category="event" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2029.05.18–2029.06.03</time><span class="notice-category">EXHIBITION</span><strong>{{title}}</strong></summary><div class="notice-body"><p>NIGHT OFF-CAMERA ARCHIVE <strong>OUT OF FRAME</strong>. 다섯 전시 공간과 공식 티켓으로 구성된 전시 아카이브가 공개되었습니다.</p><a class="notice-feature-image" href="out-of-frame.html"><img src="assets/images/out-of-frame/space-01.webp" alt="OUT OF FRAME 공식 전시" loading="lazy"></a><a class="notice-link-btn" href="out-of-frame.html">ENTER EXHIBITION →</a></div>'},
            {id:'season-greetings-2028',title:'2028 SEASON’S GREETINGS OFF DUTY 공개',attributesHtml:' data-notice-category="fanclub" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2028.01.02</time><span class="notice-category">SEASON’S GREETINGS</span><strong>{{title}}</strong></summary><div class="notice-body"><p>NIGHT의 2028 시즌그리팅 <strong>OFF DUTY</strong> 공식 아카이브가 공개되었습니다.</p><a class="notice-feature-image" href="season-greetings-2028.html"><img src="assets/images/final-additions/season/season-06.webp" alt="2028 OFF DUTY 시즌그리팅" loading="lazy"></a><a class="notice-link-btn" href="season-greetings-2028.html">EXPLORE OFF DUTY →</a></div>'},
            {id:'luna6-release',title:'LUNA 6th Generation AFTERIMAGE 멤버십 키트 공개',attributesHtml:' data-notice-category="fanclub" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2028.11.20</time><span class="notice-category">FANCLUB</span><strong>{{title}}</strong></summary><div class="notice-body"><p>공식 팬클럽 LUNA 6기 멤버십 키트 <strong>AFTERIMAGE</strong>가 공개되었습니다.</p><a class="notice-feature-image" href="luna6.html"><img src="assets/images/luna6/01-box.webp" alt="LUNA 6기 AFTERIMAGE" loading="lazy"></a><a class="notice-link-btn" href="luna6.html">VIEW LUNA 6TH KIT →</a></div>'},
            {id:'season-greetings-2027',title:'2027 SEASON’S GREETINGS LUNA ACADEMY 공개',attributesHtml:' data-notice-category="fanclub" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2027.01.02</time><span class="notice-category">SEASON’S GREETINGS</span><strong>{{title}}</strong></summary><div class="notice-body"><p>NIGHT의 2027 시즌그리팅 <strong>LUNA ACADEMY</strong> 공식 아카이브가 공개되었습니다.</p><a class="notice-feature-image" href="season-greetings-2027.html"><img src="assets/images/season-2027/academy-19.webp" alt="2027 LUNA ACADEMY 시즌그리팅" loading="lazy"></a><a class="notice-link-btn" href="season-greetings-2027.html">ENTER THE ACADEMY →</a></div>'},
            {id:'luna5-release',title:'LUNA 5th Generation EVERNIGHT 멤버십 키트 공개',attributesHtml:' data-notice-category="fanclub" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2027.11.20</time><span class="notice-category">FANCLUB</span><strong>{{title}}</strong></summary><div class="notice-body"><p>공식 팬클럽 LUNA 5기 멤버십 키트 <strong>EVERNIGHT</strong>가 공개되었습니다.</p><a class="notice-feature-image" href="luna5.html"><img src="assets/images/luna5/03-membership-box.webp" alt="LUNA 5기 EVERNIGHT" loading="lazy"></a><a class="notice-link-btn" href="luna5.html">VIEW LUNA 5TH KIT →</a></div>'},
            {id:'second-concert-2026',title:'NIGHT 2ND CONCERT BEYOND THE NIGHT 공식 아카이브',attributesHtml:' data-notice-category="event" class="notice-item reveal"',bodyTemplateHtml:'<summary><time>2026.05.02–2026.05.03</time><span class="notice-category">CONCERT</span><strong>{{title}}</strong></summary><div class="notice-body"><p>NIGHT의 두 번째 단독 콘서트 <strong>BEYOND THE NIGHT</strong> 공식 기록을 공개합니다.</p><a class="notice-feature-image" href="concert-archive.html"><img src="assets/images/visual-archive/concert-02.webp" alt="2ND CONCERT BEYOND THE NIGHT" loading="lazy"></a><a class="notice-link-btn" href="concert-archive.html">VIEW CONCERT ARCHIVE →</a></div>'}
          );
          const key=n=>{const m=n.bodyTemplateHtml.match(/<time>(\d{4})\.(\d{2})\.(\d{2})/);return m?m.slice(1,4).join(''):'00000000'};
          notices.sort((a,b)=>key(b).localeCompare(key(a)));
          fs.writeFileSync('src/data/notices.json',JSON.stringify(notices,null,2)+'\n');
          const page=JSON.parse(fs.readFileSync('src/pages/notice.json','utf8'));
          page.contentHtml=page.contentHtml.replace(/전체 공지 \d+건/,'전체 공지 27건');
          for(const year of ['2029','2028','2027','2026']){
            const idx=[]; notices.forEach((n,i)=>{if(n.bodyTemplateHtml.includes(`<time>${year}.`))idx.push(i)});
            const block=`<section class="notice-year-group" aria-labelledby="notice-year-${year}"><h2 class="notice-year-title" id="notice-year-${year}">${year}</h2><div class="notice-list">\n${idx.map(i=>`{{notices:${i}}}`).join('\n')}\n</div></section>`;
            const re=new RegExp(`<section class="notice-year-group" aria-labelledby="notice-year-${year}"><h2 class="notice-year-title" id="notice-year-${year}">${year}<\\/h2><div class="notice-list">[\\s\\S]*?<\\/div><\\/section>`);
            page.contentHtml=page.contentHtml.replace(re,block);
          }
          fs.writeFileSync('src/pages/notice.json',JSON.stringify(page,null,2)+'\n');
          let nf=fs.readFileSync('tests/notice-fashion.test.mjs','utf8').replace(/length,19\)/g,'length,27)').replace(/notices\.length,19\)/g,'notices.length,27)');
          fs.writeFileSync('tests/notice-fashion.test.mjs',nf);
          let ct=fs.readFileSync('tests/collections.test.mjs','utf8').replace(/19 notices and six membership cards render/g,'27 notices and six membership cards render').replace(/\['notices',19,NoticeItem\]/g,"['notices',27,NoticeItem]");
          fs.writeFileSync('tests/collections.test.mjs',ct);
          NODE
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit reconciled notices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/notices.json src/pages/notice.json tests/notice-fashion.test.mjs tests/collections.test.mjs maintenance/web-media-manifest.json maintenance/image-audit.json
          git commit -m 'Reconcile missing official notices' || exit 0
          git push
