name: Add ABOUT NIGHT Page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-about-night-page.yml'
permissions:
  contents: write
jobs:
  build-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/add-about-night-page.mjs
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Verify ABOUT NIGHT output
        run: |
          test -s dist/about-night.html
          grep -q 'OFFICIAL GROUP PROFILE' dist/about-night.html
          grep -q 'ABOUT NIGHT' dist/index.html
          grep -q 'about-night.html' dist/sitemap.xml
      - name: Commit ABOUT NIGHT page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about-night.json src/components/layout.mjs src/react/routes.mjs src/react/App.jsx src/react/HomePage.jsx src/data/archive.json maintenance
          git commit -m "Add ABOUT NIGHT group profile" || exit 0
          git push
