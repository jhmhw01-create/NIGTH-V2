name: Fix ABOUT NIGHT Hero Crop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-about-night-hero.yml'
permissions:
  contents: write
jobs:
  fix-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-about-night-hero.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Verify ABOUT NIGHT hero output
        run: |
          test -s dist/about-night.html
          grep -q 'object-position:50% 28%' dist/about-night.html
      - name: Commit hero crop fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/about-night.json
          git commit -m "Fix ABOUT NIGHT hero face crop" || exit 0
          git push
