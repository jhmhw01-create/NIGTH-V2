name: Polish Fan-Facing Copy V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-public-copy-v2.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply reviewed fan-facing copy
        run: |
          sed -n "/node <<'NODE'/,/^          NODE$/p" .github/workflows/polish-public-copy.yml | sed '1d;$d;s/^          //' > /tmp/polish-public-copy.js
          node /tmp/polish-public-copy.js
      - name: Update copy regression tests
        run: |
          node <<'NODE'
          const fs=require('fs');
          {
            const path='tests/history-fashion.test.mjs';
            let s=fs.readFileSync(path,'utf8');
            s=s.replace('"Second Solo Concert"','"NIGHT 2ND CONCERT — BEYOND THE NIGHT"');
            s=s.replace('<p>NIGHT 두 번째 단독 콘서트 개최. 이틀간의 공연으로 LUNA와 다시 만난 NIGHT의 두 번째 단독 공연.</p>','<p>THE NIGHT HAS NO END. 이틀간의 공연으로 NIGHT와 LUNA가 다시 만난 두 번째 단독 콘서트.</p>');
            s=s.replace('<p>CONCEPT PHOTO A / B 공개와 음악방송·프로모션 활동으로 PHANTOM 시대를 전개.</p>','<p>몽환적인 환영과 반사의 이미지를 무대와 비주얼로 확장하며 PHANTOM의 밤을 이어갔다.</p>');
            s=s.replace("test('original dates and descriptions remain verbatim'","test('history retains canonical dates and reviewed fan-facing descriptions'");
            fs.writeFileSync(path,s);
          }
          {
            const path='tests/react-listen.test.mjs';
            let s=fs.readFileSync(path,'utf8');
            s=s.replace('Listen retains thirteen native players and NIGHTMARE availability notice','Listen retains thirteen native players and neutral availability notice');
            s=s.replace('제작사의 사정으로 해당 앨범부터는 음원이 제공되지 않습니다.','이 곡은 공식 사이트 내 스트리밍을 지원하지 않습니다.');
            fs.writeFileSync(path,s);
          }
          NODE
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit polished fan-facing copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/react/HomePage.jsx src/pages/history.json src/pages/listen.json src/pages/fanclub.json src/pages/store.json src/pages/press.json src/pages/awards.json src/pages/era-archive.json tests/history-fashion.test.mjs tests/react-listen.test.mjs maintenance/web-media-manifest.json maintenance/image-audit.json
          git commit -m 'Polish fan-facing site copy' || exit 0
          git push
