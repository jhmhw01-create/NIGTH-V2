name: Refresh 2029 season media manifests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-2029-season-media.yml'
      - 'public/assets/images/2029/season-greetings/**'
      - 'src/pages/season-greetings-2029.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Refresh media manifests
        run: npm run audit:media:update
      - name: Commit refreshed manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/*.json
          if git diff --cached --quiet; then
            echo "Media manifests already current."
            exit 0
          fi
          git commit -m "Refresh media manifests for 2029 season greetings"
          git push
