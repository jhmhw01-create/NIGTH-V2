name: Normalize Store Multi Options
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-store-multi-options.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/normalize-store-multi-options.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit normalized options
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/md-store.js src/pages/store.json tests/store-medley.test.mjs
          git commit -m "Support member and size options in MD store" || exit 0
          git push
