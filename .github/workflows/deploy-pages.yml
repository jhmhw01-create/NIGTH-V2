name: Audit image dimensions

on:
  push:
    branches: [audit/image-size-optimization]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect image tools
        run: |
          command -v identify || true
          command -v magick || true
          command -v cwebp || true
          command -v webpmux || true
      - name: Report largest WebP images
        run: |
          python3 - <<'PY'
          import os, subprocess
          rows=[]
          for root,_,files in os.walk('public/assets/images'):
              for f in files:
                  if not f.lower().endswith('.webp'): continue
                  p=os.path.join(root,f)
                  size=os.path.getsize(p)
                  try:
                      out=subprocess.check_output(['identify','-format','%w %h',p],text=True,stderr=subprocess.DEVNULL).strip()
                      w,h=map(int,out.split())
                  except Exception:
                      w=h=0
                  rows.append((size,w,h,p))
          rows.sort(reverse=True)
          print('TOP 80 BYTES')
          for size,w,h,p in rows[:80]: print(f'{size}\t{w}x{h}\t{p}')
          print('\nTOP 80 PIXELS')
          rows2=sorted(rows,key=lambda x:x[1]*x[2],reverse=True)
          for size,w,h,p in rows2[:80]: print(f'{w*h}\t{w}x{h}\t{size}\t{p}')
          PY
