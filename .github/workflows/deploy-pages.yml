name: Verify LUNA 7TH Membership Page

on:
  push:
    branches: [audit/luna7-membership-page]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Refresh media manifests
        run: npm run audit:media:update
      - name: Test
        run: npm test
      - name: Verify media manifests
        run: npm run audit:media
      - name: Refresh legacy asset audit
        run: UPDATE_LEGACY_ASSET_AUDIT=1 npm run build
      - name: Build with reviewed audits
        run: npm run build
      - name: Verify LUNA 7 output
        run: |
          test -s dist/luna7.html
          grep -q 'MIDNIGHT OBSERVATORY' dist/luna7.html
          grep -q 'luna7.html' dist/fanclub.html
      - name: Commit refreshed audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance/web-media-manifest.json maintenance/image-audit.json maintenance/legacy-asset-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh audits for LUNA 7th"
          git push origin HEAD:audit/luna7-membership-page
