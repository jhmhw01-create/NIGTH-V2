name: Deploy NIGHT V2

on:
  push:
    branches: [main, cleanup/retire-legacy-js]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Report root unreferenced media
        run: node scripts/list-root-unreferenced-media.mjs
      - name: Verify media manifests
        run: npm run audit:media
      - name: Build and refresh legacy asset audit
        env:
          UPDATE_LEGACY_ASSET_AUDIT: '1'
        run: npm run build
      - name: Test refreshed cleanup state
        run: npm test
      - name: Commit refreshed legacy asset audit on cleanup branch
        if: github.ref == 'refs/heads/cleanup/retire-legacy-js'
        run: |
          if git diff --quiet -- maintenance/legacy-asset-audit.json; then
            echo "Legacy asset audit already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add maintenance/legacy-asset-audit.json
            git commit -m "Refresh legacy asset audit after JavaScript retirement"
            git push
          fi
      - name: Verify site output
        run: |
          test -s dist/index.html
          test -s dist/contents.html
          test -s dist/assets/css/style.css
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
