name: Commit verified hero optimization

on:
  push:
    branches: [audit/image-size-optimization]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Optimize and verify exact pixels
        run: |
          set -euo pipefail
          SRC=public/assets/images/home-hero-night.webp
          mkdir -p /tmp/webp-opt
          dwebp "$SRC" -ppm -o /tmp/webp-opt/source.ppm >/dev/null 2>&1
          cwebp -quiet -lossless -z 9 /tmp/webp-opt/source.ppm -o /tmp/webp-opt/optimized.webp
          dwebp /tmp/webp-opt/optimized.webp -ppm -o /tmp/webp-opt/optimized.ppm >/dev/null 2>&1
          cmp /tmp/webp-opt/source.ppm /tmp/webp-opt/optimized.ppm
          test "$(stat -c%s /tmp/webp-opt/optimized.webp)" -lt "$(stat -c%s "$SRC")"
          cp /tmp/webp-opt/optimized.webp "$SRC"
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit only verified media outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/home-hero-night.webp maintenance/web-media-manifest.json maintenance/image-audit.json
          git commit -m "Optimize home hero without pixel changes"
          git push origin HEAD:audit/image-size-optimization
