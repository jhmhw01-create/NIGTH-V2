name: Find large lossless WebP assets

on:
  push:
    branches: [audit/image-size-optimization]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find lossless assets over 180KB
        run: |
          python3 - <<'PY'
          import os, struct
          def chunks(path):
              out=[]
              with open(path,'rb') as f:
                  data=f.read()
              if data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': return out
              pos=12
              while pos+8<=len(data):
                  typ=data[pos:pos+4]
                  n=int.from_bytes(data[pos+4:pos+8],'little')
                  out.append(typ.decode('ascii','replace'))
                  pos += 8+n+(n&1)
              return out
          rows=[]
          for root,_,files in os.walk('public/assets/images'):
              for name in files:
                  if not name.endswith('.webp'): continue
                  p=os.path.join(root,name); size=os.path.getsize(p)
                  if size<180000: continue
                  cs=chunks(p)
                  if 'VP8L' in cs:
                      rows.append((size,p,','.join(cs)))
          rows.sort(reverse=True)
          print(f'COUNT={len(rows)}')
          print(f'TOTAL_BYTES={sum(x[0] for x in rows)}')
          for size,p,cs in rows: print(f'{size}\t{p}\t{cs}')
          PY
