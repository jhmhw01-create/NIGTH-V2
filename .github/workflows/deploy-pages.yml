name: Verify media priority cleanup

on:
  push:
    branches: [audit/media-priority-1-3]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Apply safe media cleanup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const travelPath = 'src/pages/travel.json';
          let travel = fs.readFileSync(travelPath, 'utf8');
          const travelPairs = [
            ['assets/images/travel/full/04-private-flight.webp', 'assets/images/travel/thumbs/04-private-flight.webp'],
            ['assets/images/travel/full/12-mad-tea-party.webp', 'assets/images/travel/thumbs/12-mad-tea-party.webp'],
            ['assets/images/travel/full/20-las-vegas-together.webp', 'assets/images/travel/thumbs/20-las-vegas-together.webp'],
            ['assets/images/travel/full/28-hotel-checkout.webp', 'assets/images/travel/thumbs/28-hotel-checkout.webp']
          ];
          for (const [from, to] of travelPairs) {
            if (!travel.includes(`data-full=\\"${from}\\"`)) throw new Error(`Missing expected travel reference: ${from}`);
            travel = travel.replace(`data-full=\\"${from}\\"`, `data-full=\\"${to}\\"`);
          }
          fs.writeFileSync(travelPath, travel);

          const retired = [
            'assets/images/gallery/full/phantom-b-doha.webp',
            'assets/images/gallery/full/phantom-b-group.webp',
            'assets/images/gallery/full/phantom-b-ihwan.webp',
            'assets/images/gallery/full/phantom-b-jiwoo.webp',
            'assets/images/gallery/full/phantom-b-taehoon.webp',
            'assets/images/gallery/full/phantom-b-woohyun.webp',
            'assets/images/gallery/thumbs/phantom-b-doha.webp',
            'assets/images/gallery/thumbs/phantom-b-group.webp',
            'assets/images/gallery/thumbs/phantom-b-ihwan.webp',
            'assets/images/gallery/thumbs/phantom-b-jiwoo.webp',
            'assets/images/gallery/thumbs/phantom-b-taehoon.webp',
            'assets/images/gallery/thumbs/phantom-b-woohyun.webp',
            'assets/images/travel/full/04-private-flight.webp',
            'assets/images/travel/full/12-mad-tea-party.webp',
            'assets/images/travel/full/20-las-vegas-together.webp',
            'assets/images/travel/full/28-hotel-checkout.webp',
            'assets/images/md/lightstick-v2/night-lightstick-v2-08-package-contents.webp',
            'assets/images/md/lightstick-v2/night-lightstick-v2-09-package-open.webp',
            'assets/images/vlog/doha/thumbs/reactions.webp',
            'assets/images/vlog/ihwan/thumbs/reactions.webp',
            'assets/images/vlog/jiwoo/thumbs/reactions.webp',
            'assets/images/vlog/taehoon/thumbs/reactions.webp',
            'assets/images/vlog/woohyun/thumbs/reactions.webp'
          ];
          for (const p of retired) {
            const publicPath = `public/${p}`;
            if (!fs.existsSync(publicPath)) throw new Error(`Missing cleanup candidate: ${publicPath}`);
            fs.unlinkSync(publicPath);
          }

          const retiredPath = 'maintenance/retired-media.json';
          const record = JSON.parse(fs.readFileSync(retiredPath, 'utf8'));
          record.retired = [...new Set([...record.retired, ...retired])];
          fs.writeFileSync(retiredPath, `${JSON.stringify(record, null, 2)}\n`);
          NODE
      - name: Refresh media manifests
        run: npm run audit:media:update
      - name: Test
        run: npm test
      - name: Verify media manifests
        run: npm run audit:media
      - name: Build
        run: npm run build
      - name: Verify site output
        run: |
          test -s dist/index.html
          test -s dist/travel.html
          test -s dist/assets/css/style.css
      - name: Restore normal deploy workflow
        run: git show HEAD^:.github/workflows/deploy-pages.yml > .github/workflows/deploy-pages.yml
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retire verified unused media and travel duplicates"
          git push origin HEAD:audit/media-priority-1-3
