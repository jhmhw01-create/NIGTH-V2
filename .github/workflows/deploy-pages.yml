name: Deploy NIGHT V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Report root unreferenced media
        run: node scripts/list-root-unreferenced-media.mjs
      - name: Refresh media manifests for cleanup verification
        run: |
          npm run audit:media:update
          npm run audit:media
          echo '---WEB-MEDIA-MANIFEST---'
          cat maintenance/web-media-manifest.json
          echo '---IMAGE-AUDIT---'
          cat maintenance/image-audit.json
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify site output
        run: |
          test -s dist/index.html
          test -s dist/contents.html
          test -s dist/assets/css/style.css
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
