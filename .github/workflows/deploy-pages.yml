name: Deploy NIGHT V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Report root unreferenced media
        run: node scripts/list-root-unreferenced-media.mjs
      - name: Refresh media manifests after retirement
        run: npm run audit:media:update
      - name: Commit refreshed media manifests if needed
        run: |
          if ! git diff --quiet -- maintenance/web-media-manifest.json maintenance/image-audit.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add maintenance/web-media-manifest.json maintenance/image-audit.json
            git commit -m "Refresh media manifests after root cleanup"
            git push
          fi
      - name: Test
        run: npm test
      - name: Verify media manifests
        run: npm run audit:media
      - name: Build
        run: npm run build
      - name: Verify site output
        run: |
          test -s dist/index.html
          test -s dist/contents.html
          test -s dist/assets/css/style.css
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
