name: Benchmark exact-pixel WebP optimization

on:
  push:
    branches: [audit/image-size-optimization]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install WebP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
      - name: Benchmark exact-pixel re-encoding
        run: |
          set -euo pipefail
          SRC=public/assets/images/home-hero-night.webp
          mkdir -p /tmp/webp-test
          dwebp "$SRC" -ppm -o /tmp/webp-test/source.ppm >/dev/null 2>&1
          cwebp -quiet -lossless -z 9 /tmp/webp-test/source.ppm -o /tmp/webp-test/lossless.webp
          dwebp /tmp/webp-test/lossless.webp -ppm -o /tmp/webp-test/lossless.ppm >/dev/null 2>&1
          echo "SOURCE_BYTES=$(stat -c%s "$SRC")"
          echo "LOSSLESS_BYTES=$(stat -c%s /tmp/webp-test/lossless.webp)"
          echo "SOURCE_PIXELS=$(sha256sum /tmp/webp-test/source.ppm | cut -d' ' -f1)"
          echo "LOSSLESS_PIXELS=$(sha256sum /tmp/webp-test/lossless.ppm | cut -d' ' -f1)"
          cmp /tmp/webp-test/source.ppm /tmp/webp-test/lossless.ppm
          echo EXACT_PIXEL_MATCH=true
