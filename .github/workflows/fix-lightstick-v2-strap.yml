name: Fix MOONLIGHT VER.2 Strap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lightstick-v2-strap.yml'
permissions:
  contents: write
jobs:
  fix-strap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-lightstick-v2-strap.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Verify corrected V2 package
        run: |
          test -s dist/store.html
          test -s dist/fanclub.html
          ! grep -q "moonlight-v2-wrist-strap" dist/assets/js/md-store.js
          grep -q "INCLUDED · WRIST STRAP" dist/assets/js/md-store.js
          grep -q "WRIST STRAP INCLUDED" dist/fanclub.html
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/js/md-store.js src/pages/fanclub.json tests/store-medley.test.mjs
          git commit -m "Include wrist strap with MOONLIGHT VER.2" || exit 0
          git push
