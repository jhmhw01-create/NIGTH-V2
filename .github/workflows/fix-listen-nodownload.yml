name: Fix LISTEN No Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-listen-nodownload.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/fix-listen-nodownload.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit LISTEN no-download fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/listen.json tests/listen-exclusive-audio.test.mjs
          git commit -m "Hide download controls on LISTEN players" || exit 0
          git push
