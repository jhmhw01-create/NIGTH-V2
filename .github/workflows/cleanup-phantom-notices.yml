name: Cleanup PHANTOM notices

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-phantom-notices.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Keep only PHANTOM release notice
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const noticePath = 'src/data/notices.json';
          const pagePath = 'src/pages/notice.json';
          const testPath = 'tests/collections.test.mjs';
          const keepTitle = 'PHANTOM 발매 및 ILLUSION Official M/V 공개';

          const notices = JSON.parse(fs.readFileSync(noticePath, 'utf8'));
          if (notices.length !== 38) throw new Error(`Expected 38 notices before cleanup, found ${notices.length}`);
          const phantom = notices.filter(r => `${r.title}\n${r.bodyTemplateHtml}`.includes('PHANTOM'));
          if (phantom.length !== 14) throw new Error(`Expected 14 PHANTOM notices, found ${phantom.length}`);
          if (!phantom.some(r => r.title === keepTitle)) throw new Error('Canonical PHANTOM release notice not found');
          const next = notices.filter(r => !`${r.title}\n${r.bodyTemplateHtml}`.includes('PHANTOM') || r.title === keepTitle);
          if (next.length !== 25) throw new Error(`Expected 25 notices after cleanup, found ${next.length}`);
          fs.writeFileSync(noticePath, JSON.stringify(next, null, 2) + '\n');

          const page = JSON.parse(fs.readFileSync(pagePath, 'utf8'));
          page.headHtml = page.headHtml.replace(/\n<style>\n\/\* PHANTOM 08\.26 mood teaser notice inline \*\/[\s\S]*?<\/style>\n/, '\n');
          page.contentHtml = page.contentHtml.replace('전체 공지 38건', '전체 공지 25건');
          const start = page.contentHtml.indexOf('<section class="notice-year-group"');
          const end = page.contentHtml.indexOf('<p class="notice-empty"', start);
          if (start < 0 || end < 0) throw new Error('Notice year groups not found');
          const years = ['2029','2028','2027','2026'];
          const groups = years.map(year => {
            const indices = next.map((r, i) => ({r, i})).filter(({r}) => {
              const m = r.bodyTemplateHtml.match(/<time>(\d{4})/);
              return m && m[1] === year;
            }).map(({i}) => i);
            const refs = indices.map(i => `{{notices:${i}}}`).join('\n');
            return `<section class="notice-year-group" aria-labelledby="notice-year-${year}"><h2 class="notice-year-title" id="notice-year-${year}">${year}</h2><div class="notice-list">\n${refs}\n</div></section>\n`;
          }).join('');
          page.contentHtml = page.contentHtml.slice(0, start) + groups + page.contentHtml.slice(end);
          fs.writeFileSync(pagePath, JSON.stringify(page, null, 2) + '\n');

          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace("test('38 notices and six membership cards render'", "test('25 notices and six membership cards render'");
          test = test.replace("['notices',38,NoticeItem]", "['notices',25,NoticeItem]");
          const marker = "test('title fields are escaped; missing collection records fail the build'";
          const guard = `test('PHANTOM notice keeps only the album release announcement',async()=>{\n  const data=JSON.parse(await readFile(new URL('../src/data/notices.json',import.meta.url),'utf8'));\n  const phantom=data.filter(record=>(record.title+'\\n'+record.bodyTemplateHtml).includes('PHANTOM'));\n  assert.deepEqual(phantom.map(record=>record.title),['${keepTitle}']);\n});\n`;
          if (!test.includes(marker)) throw new Error('Collection test marker not found');
          test = test.replace(marker, guard + marker);
          fs.writeFileSync(testPath, test);
          NODE
      - name: Verify cleanup
        run: npm test
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-phantom-notices.yml
          git add src/data/notices.json src/pages/notice.json tests/collections.test.mjs
          git commit -m "Keep only PHANTOM release notice"
          git push
