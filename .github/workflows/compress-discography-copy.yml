name: Compress Discography Copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compress-discography-copy.yml'
permissions:
  contents: write
jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/compress-discography-copy.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit discography copy updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/discography.json src/data/albums.json
          git commit -m "Compress DISCOGRAPHY copy" || exit 0
          git push
# rerun after paragraph ERA NOTE cleanup
