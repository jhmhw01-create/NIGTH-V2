name: Cleanup React Dead Footer Scripts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-react-dead-footer.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/cleanup-react-dead-footer-scripts.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages tests/react-source-cleanup.test.mjs
          git commit -m "Remove dead footer scripts from React routes" || exit 0
          git push
# rerun after preserving authored footer markup
