name: Naturalize HOME ABOUT HISTORY Copy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/naturalize-home-about-history.yml'
permissions:
  contents: write
jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/naturalize-home-about-history-v2.mjs
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Commit copy updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react/HomePage.jsx src/pages/about-night.json src/pages/history.json
          git commit -m "Naturalize HOME ABOUT HISTORY copy" || exit 0
          git push
