name: Finish Interrupted Site Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish-interrupted-site-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/finish-interrupted-site-cleanup.mjs
      - run: npm run audit:media:update
      - run: npm test
      - run: npm run audit:media
      - run: npm run build
      - name: Verify generated SEO files
        run: |
          test -s dist/sitemap.xml
          test -s dist/robots.txt
          grep -q 'member-taehoon.html' dist/sitemap.xml
          grep -q 'sitemap.xml' dist/robots.txt
      - name: Commit cleaned sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/member-taehoon.json src/data/archive.json src/pages/index.json src/react/HomePage.jsx maintenance
          git commit -m "Finish interrupted site cleanup" || exit 0
          git push
